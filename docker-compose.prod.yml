# Production (EC2): pulls the images published by CI. Logs go to CloudWatch via awslogs.
volumes:
  pgdata:
  redisdata:

services:
  redis:
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-2}
        awslogs-group: /pollhub/redis
        awslogs-create-group: "false"
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-2}
        awslogs-group: /pollhub/db
        awslogs-create-group: "false"
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-2}
        awslogs-group: /pollhub/api
        awslogs-create-group: "false"
    image: ${DOCKERHUB_USERNAME}/pollhub-api:${TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@localhost}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-2}
        awslogs-group: /pollhub/worker
        awslogs-create-group: "false"
    image: ${DOCKERHUB_USERNAME}/pollhub-worker:${TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-us-east-2}
        awslogs-group: /pollhub/frontend
        awslogs-create-group: "false"
    image: ${DOCKERHUB_USERNAME}/pollhub-frontend:${TAG:-latest}
    ports: ["80:80"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
