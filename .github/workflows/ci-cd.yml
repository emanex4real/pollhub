name: CI/CD

on:
  push:
    branches: [main, staging]
    paths-ignore: ["README.md"]
  pull_request:
    paths-ignore: ["README.md"]

permissions:
  contents: read

env:
  AWS_REGION: us-east-2

jobs:
  codeql:
    name: Code analysis (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript
      - uses: github/codeql-action/analyze@v3

  test:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: API tests
        run: |
          pip install -r api/requirements.txt
          pytest api/tests
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Worker tests
        working-directory: worker
        run: npm install && npm test
      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build
      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.prod.yml config -q
      - name: Secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: "1"

  build-scan:
    name: Build and scan (Trivy)
    runs-on: ubuntu-latest
    needs: [codeql, test]
    strategy:
      matrix:
        image: [api, worker, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }}
        run: docker build -t pollhub-${{ matrix.image }}:ci ./${{ matrix.image }}
      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pollhub-${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish (main only)
    runs-on: ubuntu-latest
    needs: build-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        image: [api, worker, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pollhub-${{ matrix.image }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pollhub-${{ matrix.image }}:latest

  deploy:
    name: Deploy to EC2 (main only)
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write   # lets the job request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: DEBUG show OIDC subject (remove later)
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | awk '{ while (length($0) % 4) $0 = $0 "="; print }' | base64 -d | jq '{sub, aud, iss, repository, ref}'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}   # PollhubIAM
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy through Systems Manager (no SSH)
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          TAG: ${{ github.sha }}
        run: |
          B64=$(base64 -w0 docker-compose.prod.yml)
          SCRIPT=$(cat <<EOS
          set -e
          command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh
          mkdir -p /opt/pollhub && cd /opt/pollhub
          echo "$B64" | base64 -d > docker-compose.yml
          export TAG=$TAG
          docker compose pull
          docker compose up -d --wait --wait-timeout 180
          docker compose ps
          EOS
          )
          jq -n --arg s "$SCRIPT" '{commands: [$s]}' > params.json
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters file://params.json \
            --query Command.CommandId --output text)
          if ! aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query '[StandardOutputContent,StandardErrorContent]' --output text
            exit 1
          fi
          echo "Deployed commit $TAG"
